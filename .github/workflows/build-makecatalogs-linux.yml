  name: Build makecatalogs (Linux)

  on:
    push:
      branches: [linux_makecatalogs]
    workflow_dispatch:

  jobs:
    build:
      runs-on: ubuntu-latest
      container: swift:6.3.3

      steps:
        - uses: actions/checkout@v6

        - name: Cache musl SDK
          uses: actions/cache@v7
          with:
            path: ~/.swiftpm/swift-sdks
            key: swift-musl-sdk-6.3.3

        - name: Install musl SDK
          run: |
            swift sdk list | grep -q x86_64-swift-linux-musl || \
            swift sdk install \
              https://download.swift.org/swift-6.3.3-release/static-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz \
              --checksum 87c3eaf908e67c0e13a84367119e12273cec1d2cd3d81f7d74bb36722d6b607b

        - name: Build
          working-directory: code/cli/munki
          run: swift build -c release --swift-sdk x86_64-swift-linux-musl

        - name: Upload artifact
          uses: actions/upload-artifact@v7
          with:
            name: makecatalogs-linux-x86_64
            path: code/cli/munki/.build/x86_64-swift-linux-musl/release/makecatalogs

